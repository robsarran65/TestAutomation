name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m compileall app.py app_multiagent.py framework

      - name: Basic security scan
        run: |
          python -m pip install bandit
          bandit -r framework app.py app_multiagent.py -q || true

      - name: Smoke check
        run: |
          python - <<'PY'
          import os
          required = ['app.py', 'app_multiagent.py', 'framework']
          missing = [item for item in required if not os.path.exists(item)]
          if missing:
              raise SystemExit(f'Missing required project files: {missing}')
          print('Smoke validation passed.')
          PY
