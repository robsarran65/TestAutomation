# Single service: the app has no database or cache layer.
#
# Earlier versions of this file started Postgres and Redis containers, but
# nothing in the codebase ever connected to either -- they were pure overhead
# for anyone deploying it. Re-add them alongside the code that uses them.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-test-engine
    ports:
      - "8501:8501"
    environment:
      ENVIRONMENT: production
      HEADLESS: "true"          # no display in a container
      AI_PROVIDER: stub         # set to openai/claude and supply a key below
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      # Generated reports land here so they survive container restarts.
      - ./outputs:/app/outputs
    # Chrome needs more than Docker's default 64MB /dev/shm or it crashes
    # mid-run with "session deleted because of page crash".
    shm_size: "2gb"
    restart: unless-stopped
