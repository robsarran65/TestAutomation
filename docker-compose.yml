version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-test-engine-app
    ports:
      - "8501:8501"
    environment:
      APP_ENV: production
      APP_PORT: 8501
      SECRET_KEY: change-me
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_test_engine
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: ai-test-engine-db
    environment:
      POSTGRES_DB: ai_test_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-test-engine-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
