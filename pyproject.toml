[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-test-automation-engine"
version = "1.0.0"
description = "AI-powered test automation framework for web applications and APIs"
readme = "README.md"
# pandas>=2.2 and matplotlib>=3.8.4 both require 3.9+; declaring 3.8 let pip
# install on an unsupported interpreter and fail at import time.
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = [
    "test-automation",
    "ai",
    "testing",
    "web-testing",
    "api-testing",
    "selenium",
    "streamlit"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

# Keep in sync with requirements.txt (tests/test_packaging.py enforces this).
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",         # pandas needs this to read .xlsx workbooks
    "selenium>=4.21.0",        # 4.x Service API is required by core/browser.py
    "webdriver-manager>=4.0.1",
    "requests>=2.32.0",
    "fpdf>=1.7.2",
    "matplotlib>=3.8.4",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "isort>=5.0.0",
]
ai = [
    "openai>=0.27.0",
    "anthropic>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/robsarran65/TestAutomation"
Documentation = "https://github.com/robsarran65/TestAutomation/tree/main/docs"
Repository = "https://github.com/robsarran65/TestAutomation.git"
"Bug Tracker" = "https://github.com/robsarran65/TestAutomation/issues"

[project.scripts]
ai-test-engine = "ai_test_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
# Coverage is opt-in: `pytest --cov=ai_test_engine` (needs the `dev` extra).
addopts = "-q"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
